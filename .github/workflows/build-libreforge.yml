name: Build libreforge JAR

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout libreforge source
        uses: actions/checkout@v4
        with:
          repository: Auxilor/libreforge
          ref: master
          path: source

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build libreforge
        working-directory: source
        run: |
          chmod +x gradlew
          ./gradlew clean build --full-stacktrace

      - name: Show generated JARs
        if: always()
        run: find source -path '*/build/libs/*.jar' -type f -print || true

      - name: Upload libreforge JARs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: libreforge-2026.42-build
          path: source/**/build/libs/*.jar
          if-no-files-found: error
          retention-days: 7
