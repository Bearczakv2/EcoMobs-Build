name: Build EcoMobs from upstream

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current upstream EcoMobs master
        uses: actions/checkout@v4
        with:
          repository: Auxilor/EcoMobs
          ref: master
          path: source

      - name: Read upstream version and commit
        working-directory: source
        run: |
          set -euo pipefail
          VERSION=$(grep '^version=' gradle.properties | cut -d= -f2)
          LIBREFORGE_VERSION=$(grep '^libreforge-version=' gradle.properties | cut -d= -f2)
          UPSTREAM_SHA=$(git rev-parse HEAD)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "LIBREFORGE_VERSION=$LIBREFORGE_VERSION" >> "$GITHUB_ENV"
          echo "UPSTREAM_SHA=$UPSTREAM_SHA" >> "$GITHUB_ENV"
          echo "Building upstream EcoMobs $VERSION at $UPSTREAM_SHA"

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build upstream distributable JAR
        working-directory: source
        run: |
          chmod +x gradlew
          ./gradlew clean libreforgeJar --full-stacktrace

      - name: Verify upstream final JAR
        working-directory: source
        run: |
          set -euo pipefail
          FINAL_JAR=$(find bin -maxdepth 1 -type f -name '*.jar' | head -n 1)
          test -n "$FINAL_JAR"
          echo "Final JAR: $FINAL_JAR"
          unzip -l "$FINAL_JAR" | grep "libreforge-${LIBREFORGE_VERSION}-shadow.jar"
          unzip -p "$FINAL_JAR" plugin.yml | grep -F 'name: EcoMobs'
          unzip -p "$FINAL_JAR" plugin.yml | grep -F "version: ${VERSION}"
          echo "Source commit: ${UPSTREAM_SHA}"

      - name: Upload upstream EcoMobs JAR
        uses: actions/upload-artifact@v4
        with:
          name: EcoMobs-${{ env.VERSION }}-UPSTREAM
          path: source/bin/*.jar
          if-no-files-found: error
          retention-days: 7
