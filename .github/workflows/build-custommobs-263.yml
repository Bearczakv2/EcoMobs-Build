name: Build upstream CustomMobs 1.9.0

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact upstream CustomMobs
        uses: actions/checkout@v4
        with:
          repository: PandaaaPlays/CustomMobs
          ref: b2959cff5cc3d007f3de85780c136dd2a985e4ec
          path: source

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: source/CustomMobs.Plugin/pom.xml

      - name: Clean and package with Maven exactly like upstream
        working-directory: source/CustomMobs.Plugin
        run: mvn clean package

      - name: Find and verify upstream JAR
        working-directory: source/CustomMobs.Plugin
        run: |
          set -euo pipefail
          JAR_PATH=$(find target -maxdepth 1 -type f -name 'CustomMobs-*.jar' ! -name '*remapped*' | head -n 1)
          echo "Found jar: $JAR_PATH"
          test -n "$JAR_PATH"
          unzip -l "$JAR_PATH" | grep -q 'plugin.yml'
          unzip -p "$JAR_PATH" plugin.yml
          sha256sum "$JAR_PATH"
          mkdir -p final
          cp "$JAR_PATH" final/CustomMobs-1.9.0-upstream-26.2.jar

      - name: Upload CustomMobs JAR
        uses: actions/upload-artifact@v4
        with:
          name: CustomMobs-1.9.0-upstream-26.2
          path: source/CustomMobs.Plugin/final/CustomMobs-1.9.0-upstream-26.2.jar
          if-no-files-found: error
          retention-days: 7
