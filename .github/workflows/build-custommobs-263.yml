name: Build CustomMobs 26.3

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CustomMobs source
        uses: actions/checkout@v4
        with:
          repository: PandaaaPlays/CustomMobs
          ref: main
          path: source

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: source/CustomMobs.Plugin/pom.xml

      - name: Patch build for Spigot 26.3
        working-directory: source/CustomMobs.Plugin
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('pom.xml')
          s = p.read_text()
          old = '<used.spigot.version>26.2-R0.1-SNAPSHOT</used.spigot.version>'
          new = '<used.spigot.version>26.3-R0.1-SNAPSHOT</used.spigot.version>'
          if old not in s:
              raise SystemExit('Expected Spigot 26.2 version not found in pom.xml')
          p.write_text(s.replace(old, new))
          PY
          grep -n "used.spigot.version" pom.xml

      - name: Build CustomMobs against Spigot 26.3
        working-directory: source/CustomMobs.Plugin
        run: mvn -U -B clean package

      - name: Verify plugin JAR
        working-directory: source/CustomMobs.Plugin
        run: |
          set -e
          JAR=$(find target -maxdepth 1 -type f -name 'CustomMobs-*.jar' ! -name '*sources*' ! -name '*javadoc*' | head -n1)
          test -n "$JAR"
          echo "JAR=$JAR"
          unzip -l "$JAR" | grep -q 'plugin.yml'
          unzip -p "$JAR" plugin.yml
          unzip -l "$JAR" | grep -q 'ca/pandaaa/custommobs/CustomMobs.class'
          mkdir -p final
          cp "$JAR" final/CustomMobs-1.9.0-26.3.jar
          sha256sum final/CustomMobs-1.9.0-26.3.jar

      - name: Upload verified JAR
        uses: actions/upload-artifact@v4
        with:
          name: CustomMobs-1.9.0-26.3
          path: source/CustomMobs.Plugin/final/CustomMobs-1.9.0-26.3.jar
          if-no-files-found: error
          retention-days: 7
